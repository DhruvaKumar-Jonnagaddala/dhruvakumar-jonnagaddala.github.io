# a summary about you
summary: |-
  Cloud Solution Architect with 17+ years in IT and 8+ years architecting and leading enterprise-scale cloud transformation, migration, and modernization programs across AWS, Azure, and GCP for global retail, fintech, insurance, luxury, and cybersecurity organizations — including Equal Experts, Waitrose (top retailer of UK), Servana Managed Services (Official Cloudbees Partners for EMEA) & Target (US second largest retailer).

  - Proven record designing secure, compliant, and cost-optimized multi-cloud architectures — from Zero Trust, PCI DSS Level 1 payment platforms to large-scale Kubernetes and IaC-driven infrastructure.
  - Skilled at translating business objectives into cloud adoption strategies, establishing governance and DevSecOps operating models, and engaging stakeholders from engineering teams through to executive leadership.
  - I enjoy implementing quick and smart DevOps / Cloud platform engineering solutions. Few of them mentioned are below

    ***One-click environment provisioning, Shift-left security, Build resilient infrastructure, Zero downtime CI/CD, **\*AsCode** - (Configuration as code & Infrastructure as code), Container orchestration solutions, Cost review and optimisation, Smart monitoring, GitOps, ChatOps, Generative AI & Agentic Platforms.***

  - Ability to work at high and low levels to understand all elements of the technical requirements to deliver flexible and scalable solutions in the cloud.
  - Passionate about mentoring engineers and architects and building self-sufficient, future-ready platform teams.

